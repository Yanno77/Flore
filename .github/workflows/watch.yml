name: Lost dog watcher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dog-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check sites
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 watch.py

      - name: Save seen posts
        run: |
          git config user.name "dog-watcher"
          git config user.email "dog-watcher@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen posts"
          git push
